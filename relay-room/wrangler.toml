name = "opencovibe-private-room-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
ROOM_ID = "6159022b-e83d-4dcf-b80c-cdb788b0008c"
CONVERSATION_REF = "dotcliffe:01a0f942-ad0f-7640-bd9b-e12d096430eb"

# Required secret: wrangler secret put MAC_TOKEN_SHA256
# Hex SHA-256 of a high-entropy private Mac bearer, never the bearer itself.

[[durable_objects.bindings]]
name = "BROKER"
